name: Automated Mymensingh News Aggregator

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
  workflow_dispatch:
    # Allows manual one-click trigger from GitHub Actions tab

jobs:
  fetch-and-sync-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install @supabase/supabase-js

      - name: Run News Ingestion Engine
        run: node scripts/fetch-mymensingh-news.cjs
